[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex"
version = "0.2.0"
authors = [
  { name="Arwyn Hughes" },
]
description = "VORTEX - an Egyptian Rare Pepe browser adventure"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
vortex = "vortex.web_server:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["vortex/tests/test_lattice.py", "vortex/tests/test_paths.py", "vortex/tests/test_veils.py", "vortex/tests/test_runtime.py"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
include = ["vortex", "vortex.*"]
exclude = ["vortex.tests", "vortex.tests.*"]

[tool.coverage.run]
source = ["vortex"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
