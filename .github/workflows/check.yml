name: Game checks
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check:lattice
      - run: npm run check
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - run: python -m compileall -q core src vortex/src vortex/web_server.py run_game.py
