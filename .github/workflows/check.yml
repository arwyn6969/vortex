name: Game checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check:lattice
      - run: npm run check
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - run: python -m compileall -q core src vortex/src vortex/web_server.py run_game.py
